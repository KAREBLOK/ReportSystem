# ═══════════════════════════════════════════
# KAREBLOK.TC - ReportSystem ProGuard Config
# ═══════════════════════════════════════════

# Genel ayarlar
-dontshrink
-dontoptimize
-ignorewarnings
-dontnote **
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions

# ─── BUKKIT FRAMEWORK ───

# Ana plugin sinifi (plugin.yml'den yuklenir)
-keep public class com.reportsystem.spigot.ReportSystemSpigot { *; }

# Tum Listener'lar (Bukkit reflection ile @EventHandler arar)
-keep class * implements org.bukkit.event.Listener { *; }

# Command handler'lar
-keep class * implements org.bukkit.command.CommandExecutor { *; }
-keep class * implements org.bukkit.command.TabCompleter { *; }

# InventoryHolder (GUI siniflarinin holder olarak cast edilmesi icin)
-keep class * implements org.bukkit.inventory.InventoryHolder { *; }

# Enum'lar
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# ─── SERIALIZABLE (Replay Actions - common module) ───

-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    !static !transient <fields>;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}
-keepnames class * implements java.io.Serializable

# ─── RELOCATED LIBS (shade edilmis, obfuscate etme) ───

-keep class com.reportsystem.spigot.libs.** { *; }

# NPC-Lib (shade edilmis ama relocate edilmemis)
-keep class com.github.juliarn.npclib.** { *; }
-keep class io.leangen.geantyref.** { *; }

# SLF4J (HikariCP kullanir, reflection ile field erisimi var)
-keep class org.slf4j.** { *; }

# ─── DONTWARN (provided scope + internal references) ───

-dontwarn io.papermc.**
-dontwarn org.bukkit.**
-dontwarn org.spigotmc.**
-dontwarn net.md_5.**
-dontwarn com.github.retrooper.**
-dontwarn io.github.retrooper.**
-dontwarn me.clip.placeholderapi.**
-dontwarn com.comphenix.**
-dontwarn net.kyori.**
-dontwarn org.yaml.**
-dontwarn org.slf4j.**
-dontwarn com.mojang.**
-dontwarn javax.**
-dontwarn java.**
-dontwarn com.google.protobuf.**
-dontwarn com.google.gson.**
-dontwarn com.reportsystem.common.**
-dontwarn com.reportsystem.spigot.**
-dontwarn top.polar.**
-dontwarn me.frep.vulcan.**
-dontwarn ac.grim.grimac.**
-dontwarn com.github.juliarn.npclib.**
-dontwarn io.leangen.geantyref.**
