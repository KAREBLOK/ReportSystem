# ======================
# Komut Mesajları
# ======================
commands:
  report:
    usage: "/report <oyuncu> [sebep]"
    description: "Bir oyuncuyu rapor et"

  reports:
    usage: "/reports [sayfa]"
    description: "Raporları görüntüle"

  reportsystem:
    usage: "/reportsystem <reload|info|stats>"
    description: "Plugin yönetimi"
    reloaded: "%prefix_success% &aKonfigürasyon yeniden yüklendi!"

    help:
      header: "&6=== ReportSystem Komutları ==="
      reload: "&e/reportsystem reload &7- Konfigürasyonu yeniden yükle"
      stats: "&e/reportsystem stats &7- İstatistikleri göster"
      info: "&e/reportsystem info &7- Plugin bilgilerini göster"
      debug: "&e/reportsystem debug <true/false> &7- Debug modunu aç/kapat"
      testnotif: "&e/reportsystem testnotif &7- Toast bildirim testi"
      checkadv: "&e/reportsystem checkadv &7- Advancement durumunu kontrol et"

    info:
      header: "&6=== ReportSystem Bilgileri ==="
      version: "&eVersiyon: &f%version%"
      developer: "&eGeliştirici: &f%developer%"
      mode: "&eMod: &f%mode%"
      database: "&eVeritabanı: &f%database%"
      replay: "&eReplay Sistemi: &f%replay%"
      active: "Aktif"
      inactive: "Deaktif"
      bungeecord: "BungeeCord"
      standalone: "Standalone"

    stats:
      header: "&6=== ReportSystem İstatistikleri ==="
      active-recordings: "&eAktif Kayıtlar: &f%count%"
      active-replays: "&eAktif Replay İzleyicileri: &f%count%"
      total-reports: "&eToplam Rapor: &f%count%"
      pending-reports: "&eBekleyen Rapor: &f%count%"
      database-error: "&cVeritabanı istatistikleri alınamadı!"

    debug:
      usage: "&cKullanım: /reportsystem debug <true/false>"
      enabled: "&aDebug modu: &aAktif"
      disabled: "&aDebug modu: &cDeaktif"

    testnotif:
      sending: "&aToast bildirimi test ediliyor..."
      sent: "&aToast gönderildi! Sağ üst köşeyi kontrol et."
      failed: "&cAdvancementNotification sistemi başlatılamadı!"
