# ReportSystem Türkçe Mesajlar
# Renk kodları: & (örnek: yeşil için &a)
# Yer tutucular %placeholder% ile işaretlenir

# ======================
# Ön Ekler
# ======================
prefix:
  general: "&8[&6Rapor&8]"
  success: "&8[&a✓&8]"
  error: "&8[&c✗&8]"
  info: "&8[&b!&8]"
  warning: "&8[&e⚠&8]"

# ======================
# Genel Mesajlar
# ======================
general:
  no-permission: "%prefix_error% &cBu komutu kullanmak için yetkiniz yok!"
  player-not-found: "%prefix_error% &c'&e%player%&c' adlı oyuncu bulunamadı!"
  player-offline: "%prefix_error% &c%player% &7çevrimiçi değil!"
  invalid-syntax: "%prefix_error% &cKullanım: &e%usage%"
  only-players: "%prefix_error% &cBu komut sadece oyuncular tarafından kullanılabilir!"
  cooldown: "%prefix_warning% &eTekrar rapor oluşturmak için &6%time% &ebeklemelisiniz!"
  rate-limit: "%prefix_error% &cÇok fazla rapor oluşturuyorsunuz! &eLütfen 1 dakika bekleyin. &7(Limit: &f%limit% &7rapor/dakika)"
  teleported: "%prefix_success% &a%player% &7adlı oyuncuya ışınlandınız!"

  # Hata mesajları
  error:
    general: "%prefix_error% &cBir hata oluştu!"
    contact-staff: "&7Lütfen bir yetkiliyle iletişime geçin."
    database: "%prefix_error% &cVeritabanı hatası oluştu!"
    unknown: "%prefix_error% &cBilinmeyen bir hata oluştu!"
    details: "&7Hata: %error%"

# ======================
# Rapor Mesajları
# ======================
reports:
  success: "%prefix_success% &aRapor başarıyla oluşturuldu! &7(ID: #%id%)"
  cannot-report-self: "%prefix_error% &cKendinizi rapor edemezsiniz!"
  cannot-report-immune: "%prefix_error% &cBu oyuncu rapor edilemez!"
  cannot-report-offline: "%prefix_error% &c%player% &7çevrimdışı! Sadece çevrimiçi oyuncular rapor edilebilir."
  already-recording: "%prefix_error% &c%player% &7zaten kaydediliyor! Kaydı bitene kadar tekrar rapor edemezsiniz."
  reason-too-short: "%prefix_error% &cSebep en az &e%min% &ckarakter olmalıdır!"
  reason-too-long: "%prefix_error% &cSebep &e%max% &ckarakteri geçemez!"
  limit-reached: "%prefix_error% &c&e%player% &cadlı oyuncuyu daha fazla rapor edemezsiniz! &7(Limit: &f%limit%&7)"

  # Yeni limit mesajları (PENDING bazlı)
  limit-pending: "%prefix_error% &cBu oyuncu için zaten &e%count% &cbekleyen raporunuz var! &7(Maksimum: &f%limit%&7)"
  create-failed: "%prefix_error% &cRapor oluşturulurken bir hata oluştu!"
  contact-staff: "&7Lütfen bir yetkiliyle iletişime geçin."
  unexpected-error: "%prefix_error% &cRapor oluşturulurken beklenmeyen bir hata oluştu!"
  limit-wait: "&7Önceki raporlar incelenip kapatıldıktan sonra yeni rapor oluşturabilirsiniz."

  # Rapor hataları
  error:
    create-failed: "%prefix_error% &cRapor oluşturulurken bir hata oluştu!"
    update-failed: "%prefix_error% &cRapor güncellenirken bir hata oluştu!"
    delete-failed: "%prefix_error% &cRapor silinirken bir hata oluştu!"
    not-found: "%prefix_error% &cRapor bulunamadı!"
    load-failed: "%prefix_error% &cRaporlar yüklenirken bir hata oluştu!"

  # Rapor durumu mesajları
  status:
    accepted: "%prefix_success% &aRapor #%id% kabul edildi."
    rejected: "%prefix_info% &cRapor #%id% reddedildi."
    closed: "%prefix_info% &7Rapor #%id% kapatıldı."
    updated: "%prefix_success% &aRapor durumu güncellendi."

    # Durum isimleri (GUI için)
    name:
      pending: "Beklemede"
      accepted: "Kabul Edildi"
      rejected: "Reddedildi"
      closed: "Kapatıldı"

  # Bildirimler
  notify:
    staff: |
      &8&m
      %prefix_general% &eYeni Rapor!
      &7Oyuncu: &c%reported%
      &7Rapor Eden: &e%reporter%
      &7Sebep: &f%reason%
      &7Sunucu: &b%server%
      &7ID: &f#%id%
      &8&m

    title: "&6Yeni Rapor"
    subtitle: "&e%reporter% &7➜ &c%reported%"
    actionbar: "&e⚠ Yeni rapor: &c%reported% &7(#%id%)"

    # Toast bildirim ayarları (sağ üst köşedeki başarım bildirimi)
    # Frame türleri: TASK (Gelişim Yapıldı), GOAL (Hedef Tamamlandı), CHALLENGE (Görev Tamamlandı)
    # İkon: Herhangi bir Minecraft materyal adı (PAPER, MAP, BELL, BOOK, DIAMOND vb.)
    # Yer tutucular: %reporter%, %reported%, %reason%, %id%, %server%
    toast:
      new-report:
        title: "&c⚠ Yeni şikayet bildirimi! &8(#%id%)"
        icon: "BELL"
        frame: "GOAL"
      status-update:
        title: "&6Rapor #%id% &7durum: &e%status%"
        icon: "MAP"
        frame: "TASK"

  # Raporcu geri bildirimi (Hypixel tarzı - sadece kabul edilen raporlar için)
  reporter-feedback:
    accepted: "%prefix_success% &aRaporunuz incelendi ve işleme alındı! &7(Rapor #%id% - %player%)"

    # Yetkili giriş bildirimi (bekleyen raporlar)
    staff-join-title: "&6&l⚠ BEKLEYEN RAPORLAR"
    staff-join-message: "&eSunucuda &c%count% &eadet bekleyen rapor var!"
    staff-join-action: "&eKontrol etmek için: &b/reports"

  # Liste mesajları
  list:
    header: "&8&m          &r &6Rapor Listesi &7(Sayfa %page%/%max%) &8&m          "
    format: "&7#%id% &8| &e%reporter% &7➜ &c%reported% &8| &f%reason%"
    footer: "&8&m                                                  "
    empty: "%prefix_info% &7Hiç rapor bulunamadı."
    no-permission-view: "%prefix_error% &cBu raporu görüntüleme yetkiniz yok!"

  # Rapor işlem mesajları (yetkili aksiyonları)
  actions:
    select-punishment: "%prefix_warning% &eLütfen bir ceza seçin veya GUI'yi kapatın."
    accept-cancelled: "%prefix_error% &cRapor kabul işlemi iptal edildi."
    already-handled: "%prefix_error% &cBu rapor başka bir yetkili tarafından çoktan işlenmiş."
    accepted-no-punishment: "%prefix_success% &aRapor #%id% ceza verilmeden kabul edildi."
    rejected: "%prefix_error% &cRapor #%id% reddedildi."
    deleted: "%prefix_success% &aRapor #%id% ve ilgili replay silindi."
    update-failed: "%prefix_error% &cRapor güncellenemedi!"
    database-error: "%prefix_error% &cRapor güncellenirken bir veritabanı hatası oluştu."

  # Sohbet mesajları (rapor oluşturma sırasında kullanılır)
  chat:
    enter-reason: "&6Rapor sebebini yazın:"
    cancel-instruction: "&7Yazın veya &e'iptal' &7yazarak çıkın."
    creating: "&7Rapor oluşturuluyor..."
    create-error: "&cRapor oluşturulurken bir hata oluştu!"
    cancelled: "%prefix_error% &cRapor iptal edildi."
    enter-search: "&6Aramak istediğiniz oyuncu ismini yazın:"
    enter-punishment-reason: "&6%type% sebebini yazın:"
    enter-assignment: "&6Raporu atamak istediğiniz yetkili ismini yazın:"
    enter-note: "&6Eklemek istediğiniz notu yazın:"
    enter-duration: "&6Ban süresini girin (örn: 2h, 15d, 1w):"
    input-cancelled: "%prefix_error% &cGiriş iptal edildi."
    invalid-duration: "%prefix_error% &cGeçersiz süre! İşlem iptal edildi."

# ======================
# Replay Mesajları
# ======================
replay:
  starting: "%prefix_info% &eReplay başlatılıyor..."
  started: "%prefix_success% &aReplay başladı! Ana karakterin yanına ışınlandınız."
  stopped: "%prefix_info% &cReplay durduruldu."
  not-found: "%prefix_error% &cBu rapor için replay kaydı bulunamadı!"
  data-empty: "%prefix_error% &cReplay verisi boş! Kayıt bozulmuş olabilir."
  already-watching: "%prefix_error% &cZaten bir replay izliyorsunuz! Önce mevcut replay'i durdurun."
  completed: "%prefix_success% &a✓ Replay tamamlandı!"

  # Title messages
  title-started: "&6✦ REPLAY BAŞLADI ✦"
  subtitle-started: "&7%player% &8- &7Rapor #%report_id%"
  title-completed: "&6Replay Bitti"
  subtitle-completed: "&7%player% oyuncusunun kaydı sona erdi"

  # Error messages
  error-database: "%prefix_error% &cReplay yüklenirken veritabanı hatası oluştu!"
  error-read: "%prefix_error% &cReplay verisi okunurken hata oluştu!"
  error-corrupt: "&7Replay verisi bozuk olabilir. Hata: %error%"
  error-class: "%prefix_error% &cReplay sınıfı bulunamadı!"
  error-version: "&7Plugin versiyonu uyumsuz olabilir. Hata: %error%"
  error-unexpected: "%prefix_error% &cReplay başlatılırken beklenmeyen bir hata oluştu!"
  teleported: "%prefix_success% &aReplay başlatıldı! Ana karakterin yanına ışınlandınız."

  # Replay cross-server mesajları
  cross-server: "%prefix_info% &eReplay &b%server% &esunucusunda. Oraya gönderiliyorsunuz..."
  return-server: "%prefix_success% &a✦ Replay bitti! &b%server% &asunucusuna geri dönüyorsunuz..."
  return-location: "%prefix_success% &a✦ Replay bitti! Başlangıç konumunuza döndürüldünüz."
  not-watching: "%prefix_error% &cŞu anda bir replay izlemiyorsunuz!"
  stopped-error: "%prefix_error% &cReplay durduruldu (hata ile)!"
  stopped-shutdown: "%prefix_info% &cReplay durduruldu (sunucu kapanıyor)!"
  world-missing: "%prefix_error% &cReplay dünyası bulunamadı! Dünya silinmiş veya yüklenmemiş olabilir."
  server-connect-error: "%prefix_error% &cSunucuya bağlanırken bir hata oluştu!"
  world-change: "%prefix_info% &e✦ Replay: &b%world% &edünyasına geçiliyor..."
  command-blocked: "%prefix_error% &cReplay izlerken bu komutu kullanamazsınız!"
  command-blocked-tip: "&eÖnce replay'i durdurun: &f/replay stop"

  # Nametag prefixes
  nametag-recorded-player: "&c&l[İZLENEN] "

  recording:
    started: "%prefix_info% &eOyuncu hareketleri kaydediliyor..."
    stopped: "%prefix_info% &7Kayıt durduruldu."
    failed: "%prefix_error% &cKayıt başlatılamadı!"
    no-report-id: "%prefix_error% &cRapor ID'si alınamadı, kayıt iptal edildi!"
    continue-warning: "%prefix_warning% &eHareketleriniz kaydedilmeye devam ediyor!"
    auto-start: "%prefix_info% &a✦ Replay otomatik olarak başlatılıyor..."

  # Replay hataları
  error:
    data-empty: "%prefix_error% &cReplay verisi boş! Kayıt bozulmuş olabilir."
    data-corrupt: "%prefix_error% &cReplay verisi okunurken hata oluştu!"
    data-corrupt-detail: "&7Replay verisi bozuk olabilir. Hata: %error%"
    class-not-found: "%prefix_error% &cReplay sınıfı bulunamadı!"
    class-not-found-detail: "&7Plugin versiyonu uyumsuz olabilir. Hata: %error%"
    unexpected: "%prefix_error% &cReplay başlatılırken beklenmeyen bir hata oluştu!"
    unexpected-detail: "&7Hata: %error%"
    database: "%prefix_error% &cReplay yüklenirken veritabanı hatası oluştu!"
    database-detail: "&7Hata: %error%"
    load-failed: "%prefix_error% &cReplay yüklenemedi!"

  controls:
    paused: "&eDuraklatıldı"
    resumed: "&aDevam ediyor"
    speed-changed: "&7Hız: &e%speed%x"
    forward: "&7İleri sar &e%seconds%s"
    rewind: "&7Geri sar &e%seconds%s"
    jump-disabled: "%prefix_error% &c✗ Zaman atlama özelliği henüz aktif değil!"

  # Web Replay mesajları
  web-replay:
    disabled: "%prefix_error% &cWeb replay sistemi devre dışı! &7Config'den etkinleştirin."
    generating: "%prefix_info% &eWeb replay oluşturuluyor... &7(Rapor #%report_id%)"
    ready: "%prefix_success% &aWeb replay hazır!"
    url: "&b%url%"
    failed: "%prefix_error% &cWeb replay oluşturulamadı. Konsolu kontrol edin."
    usage: "%prefix_error% &cKullanım: &e/reportsystem webreplay <raporId>"
    invalid-id: "%prefix_error% &cGeçersiz rapor ID'si!"
    uploading: "%prefix_info% &eReplay web sitesine yükleniyor..."
    upload-success: "%prefix_success% &aReplay web sitesine yüklendi!"
    upload-failed: "%prefix_warning% &eReplay web sitesine yüklenemedi, lokal URL kullanılıyor."

# ======================
# Ceza Mesajları
# ======================
punishments:
  ban:
    success: "%prefix_success% &e%player% &aadlı oyuncu yasaklandı!"
    already-banned: "%prefix_error% &cOyuncu zaten yasaklı!"
    not-banned: "%prefix_error% &cOyuncu yasaklı değil!"
    unbanned: "%prefix_success% &e%player% &aadlı oyuncunun yasağı kaldırıldı!"
    offline: "%prefix_error% &c%player% &7çevrimiçi değil! Animasyonlu ban için oyuncunun online olması gerekiyor."
    enter-reason: "&6Ban sebebini girin (varsayılan: %default%)"
    animated-started: "&a⚡ &lANIMATED BAN BAŞLATILDI!"
    animated-target: "&7Hedef: &c%player%"
    animated-duration: "&7Süre: &e%duration%"
    animated-reason: "&7Sebep: &f%reason%"
    animated-message: "&4Tanrıların gazabı başlıyor..."
    # Oyuncuya gösterilen ban ekranı mesajları
    screen-temp: |
      &cSunucudan yasaklandınız!

      &7Sebep: &f%reason%
      &7Süre: &f%duration%
      &7Bitiş: &f%expires%
      &7Cezayı veren: &f%staff%
    screen-perm: |
      &cSunucudan kalıcı olarak yasaklandınız!

      &7Sebep: &f%reason%
      &7Cezayı veren: &f%staff%

      &8Ban kaldırma başvurusu için: %discord_url%
    # Animated ban özel mesajları
    death-message: "&4&l☠ &c%player% &7tanrıların gazabına uğradı!"
    animated-screen: "&4&l⚡ BAN ⚡\n&cSebep: &f%reason%\n&7Yetkili: &f%staff%"

  mute:
    success: "%prefix_success% &e%player% &aadlı oyuncu susturuldu!"
    already-muted: "%prefix_error% &cOyuncu zaten susturulmuş!"
    not-muted: "%prefix_error% &cOyuncu susturulmamış!"
    unmuted: "%prefix_success% &e%player% &aadlı oyuncunun susturulması kaldırıldı!"
    enter-reason: "&6Mute sebebini girin (varsayılan: %default%)"
    # Oyuncuya gösterilen mute bildirimi
    player-message: |
      &c▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
      &c          SUSTURULDUNUZ!

      &7  Sebep: &f%reason%
      &7  Süre: &f%duration%
      &7  Yetkili: &f%staff%
      &c▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
    # Susturulan oyuncu sohbete yazmaya çalıştığında
    chat-blocked: "&c✗ Susturulmuşsunuz!%time_left%"
    chat-blocked-detail: "&7Sohbete yazamazsınız."
    time-remaining: " (%time% kaldı)"
    time-permanent: " (Kalıcı)"
    # Susturma kaldırıldığında oyuncuya
    unmuted-player: "&a✓ Artık konuşabilirsiniz!"

  kick:
    success: "%prefix_success% &e%player% &7sunucudan atıldı!"
    offline: "%prefix_error% &c%player% &7çevrimiçi değil!"
    enter-reason: "&6Kick sebebini girin (varsayılan: %default%)"
    player-message: |
      &c&lSUNUCUDAN ATILDINIZ!

      &7Sebep: &f%reason%
      &7Yetkili: &f%staff%
    # Internal kick ekranı (tekrar giriş notu ile)
    screen: |
      &cSunucudan atıldınız!

      &7Sebep: &f%reason%
      &7Atan yetkili: &f%staff%

      &aTekrar girebilirsiniz.

  warn:
    success: "%prefix_success% &e%player% &7uyarıldı!"
    success-detail: "&7Mesaj: &f%reason%"
    offline: "%prefix_error% &c%player% &7çevrimiçi değil!"
    enter-reason: "&6Uyarı mesajını girin (varsayılan: %default%)"
    player-message: |
      &6▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
      &6          ⚠ UYARI ⚠

      &c  Bir yetkili tarafından uyarıldınız!

      &7  Sebep: &f%reason%
      &7  Yetkili: &f%staff%
      &7  Uyarı sayınız: &e%count%

      &c  Kuralları ihlal etmeye devam ederseniz
      &c  daha ağır cezalar alabilirsiniz!
      &6▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
    title: "&6⚠ UYARI ⚠"
    subtitle: "&cKuralları ihlal ettiniz!"
    # Oyuncu giriş yaptığında uyarı hatırlatması
    login-warning: "&e⚠ &cDikkat! &f%count% &cadet uyarınız bulunmaktadır!"
    login-warning-detail: "&7Kuralları ihlal etmeye devam ederseniz ceza alabilirsiniz."

  # Genel ceza mesajları
  applied: "%prefix_success% &aCeza başarıyla uygulandı."
  applied-with-report: "%prefix_success% &a✓ Ceza uygulandı ve rapor kabul edildi!"
  applied-report-failed: "%prefix_error% &cCeza uygulandı ama rapor güncellenemedi!"
  failed: "%prefix_error% &cCeza uygulanamadı."
  removed: "%prefix_success% &aCeza kaldırıldı."
  history-empty: "%prefix_info% &7Bu oyuncunun ceza geçmişi temiz."
  duration-invalid: "%prefix_error% &cGeçersiz süre formatı!"
  default-reason: "Kural ihlali"
  # Ceza başarı mesajı (oyuncu adıyla)
  success-target: "%prefix_success% &a✓ &e%player% &aiçin ceza başarıyla uygulandı."
  # Ceza kaldırma mesajları
  unban-success: "%prefix_success% &a✓ &e%player% &abanı kaldırıldı!"
  unban-failed: "%prefix_error% &c✗ &e%player% &cbanı kaldırılırken hata oluştu!"
  unmute-success: "%prefix_success% &a✓ &e%player% &asusturması kaldırıldı!"
  unmute-failed: "%prefix_error% &c✗ &e%player% &csusturması kaldırılırken hata oluştu!"
  no-active-punishment: "%prefix_error% &c%player% için aktif bir ceza bulunamadı!"
  no-active-detail: "&7Ban veya mute cezası yok."
  operation-complete: "&7İşlem tamamlandı!"
  # Discord URL (ban ekranında gösterilir)
  discord-url: "discord.gg/sunucu"

# ======================
# Komut Mesajları
# ======================
commands:
  report:
    usage: "/report <oyuncu> [sebep]"
    description: "Bir oyuncuyu rapor et"

  reports:
    usage: "/reports [sayfa]"
    description: "Raporları görüntüle"

  reportsystem:
    usage: "/reportsystem <reload|info|stats>"
    description: "Plugin yönetimi"
    reloaded: "%prefix_success% &aKonfigürasyon yeniden yüklendi!"

    help:
      header: "&6=== ReportSystem Komutları ==="
      reload: "&e/reportsystem reload &7- Konfigürasyonu yeniden yükle"
      stats: "&e/reportsystem stats &7- İstatistikleri göster"
      info: "&e/reportsystem info &7- Plugin bilgilerini göster"
      debug: "&e/reportsystem debug <true/false> &7- Debug modunu aç/kapat"
      testnotif: "&e/reportsystem testnotif &7- Toast bildirim testi"
      checkadv: "&e/reportsystem checkadv &7- Advancement durumunu kontrol et"

    info:
      header: "&6=== ReportSystem Bilgileri ==="
      version: "&eVersiyon: &f%version%"
      developer: "&eGeliştirici: &f%developer%"
      mode: "&eMod: &f%mode%"
      database: "&eVeritabanı: &f%database%"
      replay: "&eReplay Sistemi: &f%replay%"
      active: "Aktif"
      inactive: "Deaktif"
      bungeecord: "BungeeCord"
      standalone: "Standalone"

    stats:
      header: "&6=== ReportSystem İstatistikleri ==="
      active-recordings: "&eAktif Kayıtlar: &f%count%"
      active-replays: "&eAktif Replay İzleyicileri: &f%count%"
      total-reports: "&eToplam Rapor: &f%count%"
      pending-reports: "&eBekleyen Rapor: &f%count%"
      database-error: "&cVeritabanı istatistikleri alınamadı!"

    debug:
      usage: "&cKullanım: /reportsystem debug <true/false>"
      enabled: "&aDebug modu: &aAktif"
      disabled: "&aDebug modu: &cDeaktif"

    testnotif:
      sending: "&aToast bildirimi test ediliyor..."
      sent: "&aToast gönderildi! Sağ üst köşeyi kontrol et."
      failed: "&cAdvancementNotification sistemi başlatılamadı!"
      title: "Test Bildirimi"
      message: "Bu bir test toast bildirimidir"

    checkadv:
      header: "&6=== Advancement Durumu ==="
      loaded: "&a✓ Advancement yüklü: &freportsystem:notification"
      working: "&aToast bildirimleri çalışacak!"
      not-found: "&c✗ Advancement bulunamadı!"
      datapack-loaded: "&eDatapack yüklü ama advancement tanınmıyor."
      need-restart: "&eSunucuyu restart etmelisin!"
