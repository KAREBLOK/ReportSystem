# ReportSystem Spigot Configuration
# Support: https://kareblok.tc

# ======================
# License Settings
# ======================
license:
  # Enter your license key here
  # Purchase a license at: https://kareblok.tc
  # Format: KB-XXXX-XXXX-XXXX
  #
  # BungeeCord Users:
  # You can use the same license on multiple servers (Factions, Skyblock, PvP, etc.)
  # Check your max_servers setting from the admin panel.
  license-key: "KB-XXXX-XXXX-XXXX"

  # API URL (do not change)
  api-url: "https://kareblok.tc"

# ======================
# Telemetry Settings
# ======================
telemetry:
  # Enable/disable telemetry system
  # Collects server statistics (player count, report count, TPS, etc.)
  # Data is collected anonymously and used only for development
  # You can disable it anytime
  enabled: true

# ======================
# General Settings
# ======================
general:
  # Enable debug mode (shows detailed logs)
  debug: false

  # Language file to use (messages_en.yml, messages_tr.yml, etc.)
  language: "en"

  # Date format for timestamps
  date-format: "dd/MM/yyyy HH:mm:ss"

  # Enable update checker
  check-updates: true

# ======================
# Database Settings
# ======================
database:
  # Database type: 'sqlite' or 'mysql'
  # For BungeeCord networks, use 'mysql'
  type: sqlite

  # MySQL settings (only if type is mysql)
  mysql:
    host: "localhost"
    port: 3306
    database: "reportsystem"
    username: "root"
    password: "CHANGE_THIS_PASSWORD"

    # Connection pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# ======================
# BungeeCord Settings
# ======================
bungeecord:
  # Enable BungeeCord support
  enabled: false

  # Server display name (for GUIs)
  # Leave empty to use actual server name
  display-name: ""

# ======================
# Report Settings
# ======================
reports:
  # Require target player to be online
  # If true, players can only report online players
  # If false, offline players can also be reported
  require-online: true

  # Cooldown between reports (seconds)
  # Set to 0 to disable
  cooldown: 60

  # Global rate limit (reports per minute)
  # Even users with cooldown bypass permission are limited to this
  # Set to -1 to disable
  # Example: If set to 5, a player can create maximum 5 reports per minute
  global-rate-limit: 5

  # Maximum reports per player (same reporter to same reported player)
  # Set to -1 to disable
  # Example: If set to 3, a player can only report the same person 3 times
  max-reports-per-player: 3

  # Minimum reason length
  min-reason-length: 10

  # Maximum reason length
  max-reason-length: 100

  # Auto-close reports after X days
  # Set to -1 to disable
  auto-close-days: 30

  # Report categories
  categories:
    - "Cheating"
    - "Harassment"
    - "Spam"
    - "Griefing"
    - "Bug Abuse"
    - "Other"

  # Notifications
  notifications:
    # Send notification to staff when report created
    notify-staff: true

    # Play sound for staff notifications
    sound-enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"

    # Send title to staff
    title-enabled: true

    # Send action bar to staff
    actionbar-enabled: false

  # Reporter Feedback (Hypixel style)
  # When a report is accepted, notify the reporter that action was taken
  # Rejected reports do NOT send notifications (like Hypixel)
  reporter-feedback:
    enabled: true
    sound-enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"


# ======================
# Trust Level (Account Standing)
# ======================
# Violation points decay over time using half-life formula
# Old violations have less impact, good behavior is rewarded naturally
trust-level:
  enabled: true

  # Violation points per punishment type
  points:
    ban: 40
    mute: 15
    kick: 10
    warn: 5

  # Decay settings
  decay:
    # Half-life in days - violation loses half its impact after this many days
    # 30 days: BAN (40pts) -> 20pts after 30 days -> 10pts after 60 days
    half-life-days: 30


# ======================
# Replay Settings
# ======================
replay:
  # Enable replay system
  enabled: true

  # Auto-record on report
  auto-record: true

  # Recording duration (seconds)
  recording-duration: 45

  # Maximum concurrent recordings
  # 3 recommended for performance (each recording uses ~3-4 ms/tick CPU)
  max-recordings: 3

  # Maximum replay file size (MB)
  # Set to -1 to disable (unlimited size)
  # 5 MB = more than enough for a 45-second recording
  max-file-size: 5

  # Auto-delete replays after X days
  # Set to -1 to disable
  auto-delete-days: 7

  # Replay quality settings
  quality:
    # Ticks per second (20 = full quality, 10 = half quality)
    tps: 20

    # Record nearby players
    record-nearby-players: true

    # Nearby player radius
    nearby-radius: 50

    # Record inventory changes
    record-inventory: true

    # Record chat messages
    record-chat: true

    # Record block changes
    record-blocks: true

  # Nearby Player Tracking Settings
  # Controls how nearby players are recorded during replay
  nearby-player-tracking:
    # Enable enhanced nearby player tracking
    enabled: true

    # Tracking interval (ticks)
    # Lower = smoother movement, higher CPU usage
    # 3 = ideal balance (150ms), 5 = performance focused, 2 = smoothest
    interval-ticks: 3

    # Maximum tracking distance (blocks)
    # Players within this distance are recorded as nearby NPCs
    # 32 = normal combat range, 48 = very wide (unnecessary CPU)
    distance: 32

    # Movement threshold (blocks)
    # Movements smaller than this are not recorded
    # 0.05 = 5cm, invisible to the eye but 40-60% less data
    movement-threshold: 0.05

    # Use PlayerMoveEvent for instant tracking
    # If true, uses event-based tracking (more accurate but higher CPU)
    # If false, only periodic tracking is used
    use-move-event: false

    # What to track for nearby players
    track:
      # Equipment changes (armor, items)
      equipment: true

      # Animations (swing, damage)
      animations: true

      # Sneaking state
      sneaking: true

      # Sprinting state
      sprinting: true

      # Block break/place (expensive, not recommended)
      blocks: false

      # Item usage (bow, shield, food)
      item-use: false

  # NPC settings
  npc:
    # NPC view distance
    view-distance: 50

    # Show player nametag
    show-nametag: true

    # NPC glow color (when selected)
    glow-color: "YELLOW"

  # ======================
  # Web Replay Settings
  # ======================
  # Converts replay recordings to a web browser viewable format.
  # Viewed in 3D via mcraft.fun (minecraft-web-client).
  web-replay:
    # Enable web replay system
    enabled: false

    # Auto-generate web replay when recording ends
    auto-generate: false

    # Directory for generated .packets.txt files
    # Leave empty to use the plugin's own folder (plugins/ReportSystem-Spigot/web-replays)
    storage-path: ""

    # Access URL for web replay files (CDN or web server)
    # File must be accessible at: {base-url}/replay_42.packets.txt
    # CORS header required: Access-Control-Allow-Origin: *
    base-url: ""

    # Replay viewer URL (mcraft.fun or self-hosted)
    viewer-url: "https://s.mcraft.fun"

    # KAREBLOK.TC Web Replay API (auto upload)
    # Replay file is automatically uploaded to kareblok.tc and displayed on the website
    # Leave empty to disable upload, only local files will be created
    api-url: "https://kareblok.tc/api/reportsystem/web-replay/upload.php"

# ======================
# Punishment Settings
# ======================
punishments:
  # Use global punishment system (BungeeCord)
  use-global: true

  # Default punishment reasons
  default-reasons:
    ban:
      - "Cheating"
      - "Inappropriate behavior"
      - "Ban evasion"
      - "Advertising"
    mute:
      - "Harassment"
      - "Spam"
      - "Caps Lock"
      - "Advertising"
    kick:
      - "AFK"
      - "Warning"
      - "Rejoin required"

  # Punishment durations (for quick select)
  durations:
    - "5m"
    - "30m"
    - "1h"
    - "1d"
    - "7d"
    - "30d"
    - "permanent"

# ======================
# Performance Settings
# ======================
performance:
  # Async database operations
  async-database: true

  # Cache settings
  cache:
    # Cache reports in memory
    enabled: true

    # Maximum cached reports
    max-size: 100

    # Cache expiry (minutes)
    expiry: 10

# ======================
# Overwatch Settings
# ======================
# CS:GO-style community review system
# Trusted players review reports and vote on verdicts
overwatch:
  # Enable Overwatch system
  enabled: true

  # Minimum reviewers required for consensus
  # A report needs this many reviews before action is taken
  min-reviewers: 3

  # Consensus threshold (percentage)
  # If this percentage of reviewers vote GUILTY, the report is marked as consensus-reached
  # Note: Auto-punishment is not yet implemented. Admins review consensus reports manually.
  # Example: 70.0 means if 70% or more vote guilty, consensus is reached
  consensus-threshold: 70.0

  # Auto-ban duration (days)
  # Duration for automatic bans when consensus is reached
  # Note: Auto-punishment feature is planned but not yet active
  auto-ban-duration-days: 30

  # NPC settings
  npc:
    # Hologram update interval (seconds)
    # How often NPC holograms update statistics
    hologram-update-interval: 30

  # Queue settings
  queue:
    # Auto-add reports to queue
    # If true, new reports are automatically added to Overwatch queue
    # Currently reports are added via /overwatch addqueue command or automatically on report creation
    auto-add-reports: false

    # Default priority for auto-added reports
    default-priority: 0

    # Maximum queue size
    # If queue exceeds this, oldest reports are removed
    # Set to -1 for unlimited
    max-queue-size: 100

  # Reviewer settings
  reviewer:
    # Allow skip voting
    # If false, reviewers must choose GUILTY or INNOCENT
    # Note: Skip button visibility is controlled by overwatch-verdict.yml GUI config
    allow-skip: true

    # Cooldown between reviews (seconds)
    # Set to 0 to disable
    review-cooldown: 10

  # XP and Ranking
  xp:
    # XP rewards per review
    guilty-innocent-xp: 15
    skip-xp: 5

    # XP thresholds for rank promotions
    # Players reaching these XP values will be promoted to the corresponding rank
    bronze-xp: 0
    silver-xp: 500
    gold-xp: 1000
    diamond-xp: 2500

    # XP required per level
    xp-per-level: 100

  # Reward Commands (executed when player completes a review)
  # Available placeholders: %player%, %verdict%, %xp%, %level%, %rank%
  # Commands are executed as CONSOLE
  rewards:
    enabled: false

    # Commands to run for ANY verdict (guilty, innocent, skip)
    on-review-complete:
      - "give %player% diamond 1"
      - "eco give %player% 100"

    # Commands to run ONLY for GUILTY or INNOCENT verdicts
    on-guilty-innocent:
      - "give %player% emerald 1"

    # Commands to run ONLY for SKIP verdicts
    on-skip:
      - "give %player% coal 1"

    # Commands to run when player levels up
    on-level-up:
      - "broadcast &6[Overwatch] &e%player% &7reached level &e%level%&7!"
      - "give %player% diamond 5"

    # Commands to run when player reaches a new rank
    on-rank-up:
      bronze:
        - "broadcast &c[Overwatch] &e%player% &7reached &c&lBRONZE &7rank!"
      silver:
        - "broadcast &7[Overwatch] &e%player% &7reached &7&lSILVER &7rank!"
        - "give %player% iron_ingot 32"
      gold:
        - "broadcast &6[Overwatch] &e%player% &7reached &6&lGOLD &7rank!"
        - "give %player% gold_ingot 32"
      diamond:
        - "broadcast &b[Overwatch] &e%player% &7reached &b&lDIAMOND &7rank!"
        - "give %player% diamond 64"

# ======================
# Polar Anti-Cheat Integration
# ======================
# Automatically creates recording + report when Polar detects cheating
# Requirement: Polar Anti-Cheat (PolarLoader) must be installed
#
# How it works:
#   Polar sends 4 signals: Detection, Cloud ML, Mitigation, Punishment
#   Each signal accumulates a "suspicion score". When the threshold is reached,
#   automatic recording starts, a report is created and added to Overwatch queue.
#   Cloud ML detections (killaura, auto-clicker) give the highest score.
#   Movement/reach mitigations give low score (evidence accumulation only).
#   Score decays by 50% every 60 seconds (filters temporary lag spikes).
#
polar:
  # Enable integration
  enabled: false

  # Suspicion score threshold (0.5 = sensitive, 1.0 = balanced, 1.5 = conservative)
  # Example: Cloud Combat Behavior = +0.50, Kill Aura = +0.35, Mitigation = +0.08
  # 1.0 recommended for balanced detection
  suspicion-threshold: 1.0

  # Cooldown before re-triggering for the same player (seconds)
  cooldown-seconds: 300

  # Maximum concurrent auto-recordings
  max-auto-recordings: 5

  # Auto-recording duration (seconds)
  recording-duration: 30

  # Add auto-reports to Overwatch queue
  add-to-overwatch: true

# ======================
# Vulcan Anti-Cheat Integration
# ======================
# Automatically creates recording + report when Vulcan detects cheating
# Requirement: Vulcan must be installed + enable-api: true in its config
#
# Same scoring system as Polar:
#   KillAura flag = +0.40, AutoClicker = +0.35, Scaffold = +0.35
#   Movement (Speed, Flight) = +0.10-0.15 (mitigated by setback)
#   Recording starts when score threshold is reached.
#
vulcan:
  enabled: false
  suspicion-threshold: 1.0
  cooldown-seconds: 300
  max-auto-recordings: 5
  recording-duration: 30
  add-to-overwatch: true

# ======================
# Grim AntiCheat Integration
# ======================
# Automatically creates recording + report when Grim detects cheating
# Requirement: GrimAC must be installed (free, open source)
#
# Same scoring system as Polar/Vulcan.
# Grim excels at movement, reach and scaffold detection.
#
grim:
  enabled: false
  suspicion-threshold: 1.0
  cooldown-seconds: 300
  max-auto-recordings: 5
  recording-duration: 30
  add-to-overwatch: true

# ======================
# Discord Webhook Settings
# ======================
# Advanced Discord webhook integration with buttons, embeds, and multi-language support
discord-webhook:
  # Enable Discord webhook notifications
  enabled: false

  # Discord webhook URL
  # How to get: Discord Server Settings → Integrations → Webhooks → Create Webhook
  # Copy the webhook URL and paste it here
  # Example: https://discord.com/api/webhooks/123456789/abcdefghijklmnop
  url: ""

  # Avatar URL for webhook messages
  # This will be the bot's avatar in Discord
  avatar-url: "https://i.imgur.com/4M34hi2.png"

  # Web panel URL (optional)
  # If set, buttons will link to your web panel for viewing reports
  # Example: https://panel.yourserver.com
  # Leave empty to disable panel buttons
  web-panel-url: ""

  # Add interactive buttons to messages
  # Buttons allow clicking to view reports, access help, etc.
  add-buttons: true

  # Include server name in embeds
  # Useful for BungeeCord networks to know which server the report came from
  include-server-name: true

  # Events to send
  # Control which events trigger webhook notifications
  events:
    # Send notification when new report is created
    new-report: true

    # Send notification when report is closed (accepted/rejected)
    report-closed: true

    # Send notification when player is punished
    punishment: true

  # Debug mode
  # Shows detailed webhook logs in console
  debug: false

# ============================================
# ANTI-CHEAT BYPASS (Replay viewer korumasi)
# ============================================
# Replay izleyen yetkililer sunucu tarafindan paketlerle teleport edildigi
# icin anti-cheat'ler "Timer / Blink / Flight" gibi false-positive flag atabilir
# ve viewer disconnect olabilir. Bu sistem viewer'a otomatik bypass perm verir
# ve kendi hook'larimizdaki (Vulcan/Grim/Polar) flag'leri yok sayar.
#
# Vurgulanan perm listesi default olarak yaygin anti-cheat'leri kapsar:
#   vulcan.bypass, grim.bypass, polar.bypass, themis.bypass,
#   aac.bypass, matrix.bypass, ncp.bypass, spartan.bypass, karhu.bypass,
#   intave.bypass, verus.bypass, reportsystem.bypass.anticheat
#
# Sunucunda farkli/ozel bir anti-cheat varsa, onun bypass perm'ini buraya ekle.
# Boylece replay izlerken o AC de pas geçecek.
anticheat-bypass:
  extra-permissions: []
    # ornekler:
    # - "myac.bypass"
    # - "noks.bypass.replay"