# Report Create GUI Configuration
# Used when players type /report <player>

# GUI Settings
title: "&8Rapor Et > &c%player%"
size: 45  # Must be: 9, 18, 27, 36, 45, or 54

# Background
background:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  slots: all  # 'all' or specific slots: [0,1,2,3...]

# Items
items:
  # Target player head
  player-head:
    slot: 13
    material: PLAYER_HEAD
    name: "&c&l%player%"
    lore:
      - ""
      - "&7Rapor etmek için aşağıdan"
      - "&7bir sebep seçin."
      - ""
      - "&8▪ &7Hedef: &f%player%"
      - "&8▪ &7Sunucu: &f%server%"
      - "&8▪ &7Çevrimiçi: %online_status%"

  # Report reasons
  reasons:
    cheating:
      slot: 20
      material: IRON_SWORD
      name: "&c⚔ Hile"
      lore:
        - ""
        - "&7Oyuncu yasadışı modifikasyon"
        - "&7veya hile kullanıyor."
        - ""
        - "&8Örnekler:"
        - "&8▪ &7Kill Aura"
        - "&8▪ &7Fly Hacks"
        - "&8▪ &7X-Ray"
        - ""
        - "&e► Rapor etmek için tıkla"
      enchanted: true
      enchantments:
        - "DURABILITY:1"
      flags:
        - HIDE_ENCHANTS

    chat-abuse:
      slot: 21
      material: BOOK
      name: "&6📖 Sohbet İhlali"
      lore:
        - ""
        - "&7Sohbette uygunsuz"
        - "&7davranış."
        - ""
        - "&8Örnekler:"
        - "&8▪ &7Hakaret/Küfür"
        - "&8▪ &7Spam"
        - "&8▪ &7Reklam"
        - ""
        - "&e► Rapor etmek için tıkla"

    griefing:
      slot: 22
      material: TNT
      name: "&c💣 Griefing"
      lore:
        - ""
        - "&7Başka oyuncuların yapılarını"
        - "&7yok etmek veya çalmak."
        - ""
        - "&8Örnekler:"
        - "&8▪ &7Yapı kırma"
        - "&8▪ &7Eşya çalma"
        - "&8▪ &7Arazi ihlali"
        - ""
        - "&e► Rapor etmek için tıkla"

    bug-abuse:
      slot: 23
      material: REDSTONE
      name: "&e🔧 Bug İstismarı"
      lore:
        - ""
        - "&7Oyun hatalarını kötüye"
        - "&7kullanmak."
        - ""
        - "&8Örnekler:"
        - "&8▪ &7Dupe glitch"
        - "&8▪ &7Ekonomi istismarı"
        - "&8▪ &7İzin bypass"
        - ""
        - "&e► Rapor etmek için tıkla"

    teaming:
      slot: 24
      material: GOLDEN_APPLE
      name: "&d👥 Takım Oluşturma"
      lore:
        - ""
        - "&7Solo oyun modlarında"
        - "&7takım oluşturma."
        - ""
        - "&7Sadece takım oluşturmanın"
        - "&7yasak olduğu modlarda kullanın."
        - ""
        - "&e► Rapor etmek için tıkla"

  # Custom reason
  custom-reason:
    slot: 31
    material: WRITABLE_BOOK
    name: "&b✏ Özel Sebep"
    lore:
      - ""
      - "&7Doğru kategoriyi bulamadınız mı?"
      - "&7Kendi sebebinizi yazın."
      - ""
      - "&8▪ &7Min uzunluk: &f%min_length%"
      - "&8▪ &7Max uzunluk: &f%max_length%"
      - ""
      - "&e► Sebep yazmak için tıkla"
    glow: true

  # Close button
  close:
    slot: 40
    material: BARRIER
    name: "&c✖ Kapat"
    lore:
      - "&7Bu menüyü kapat"

  # Info item
  info:
    slot: 8
    material: NETHER_STAR
    name: "&b❓ Nasıl Rapor Edilir"
    lore:
      - ""
      - "&7Kural ihlalini en iyi"
      - "&7açıklayan kategoriyi seçin."
      - ""
      - "&c&lUyarı:"
      - "&7Yanlış raporlar cezaya"
      - "&7yol açabilir!"
      - ""
      - "&8Bekleme süresi: &f%cooldown%s"

# Sounds
sounds:
  open: UI_BUTTON_CLICK
  select-reason: ENTITY_EXPERIENCE_ORB_PICKUP
  close: BLOCK_CHEST_CLOSE
  error: ENTITY_VILLAGER_NO