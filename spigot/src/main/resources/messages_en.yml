# ======================
# Command Messages
# ======================
commands:
  report:
    usage: "/report <player> [reason]"
    description: "Report a player"

  reports:
    usage: "/reports [page]"
    description: "View reports"

  reportsystem:
    usage: "/reportsystem <reload|info|stats>"
    description: "Plugin management"
    reloaded: "%prefix_success% &aConfiguration reloaded!"

    help:
      header: "&6=== ReportSystem Commands ==="
      reload: "&e/reportsystem reload &7- Reload configuration"
      stats: "&e/reportsystem stats &7- Show statistics"
      info: "&e/reportsystem info &7- Show plugin info"
      debug: "&e/reportsystem debug <true/false> &7- Toggle debug mode"
      testnotif: "&e/reportsystem testnotif &7- Test toast notification"
      checkadv: "&e/reportsystem checkadv &7- Check advancement status"

    info:
      header: "&6=== ReportSystem Information ==="
      version: "&eVersion: &f%version%"
      developer: "&eDeveloper: &f%developer%"
      mode: "&eMode: &f%mode%"
      database: "&eDatabase: &f%database%"
      replay: "&eReplay System: &f%replay%"
      active: "Active"
      inactive: "Inactive"
      bungeecord: "BungeeCord"
      standalone: "Standalone"

    stats:
      header: "&6=== ReportSystem Statistics ==="
      active-recordings: "&eActive Recordings: &f%count%"
      active-replays: "&eActive Replay Viewers: &f%count%"
      total-reports: "&eTotal Reports: &f%count%"
      pending-reports: "&ePending Reports: &f%count%"
      database-error: "&cFailed to fetch database statistics!"

    debug:
      usage: "&cUsage: /reportsystem debug <true/false>"
      enabled: "&aDebug mode: &aEnabled"
      disabled: "&aDebug mode: &cDisabled"

    testnotif:
      sending: "&aTesting toast notification..."
      sent: "&aToast sent! Check the top right corner."
      failed: "&cAdvancementNotification system could not be initialized!"
      title: "Test Notification"
      message: "This is a test toast notification"

    checkadv:
      header: "&6=== Advancement Status ==="
      loaded: "&a✓ Advancement loaded: &freportsystem:notification"
      working: "&aToast notifications will work!"
      not-found: "&c✗ Advancement not found!"
      datapack-loaded: "&eDatapack is loaded but advancement is not recognized."
      need-restart: "&eYou need to restart the server!"
      fallback: "&7Title will be used as fallback."
      datapack-exists: "&a✓ Datapack folder exists"
      json-exists: "&a✓ notification.json file exists"
      json-missing: "&c✗ notification.json file not found!"
      datapack-missing: "&c✗ Datapack folder not found!"

# ======================
# Overwatch Messages
# ======================
overwatch:
  prefix: "&8[&6⚖&8]"

  # NPC Messages
  npc:
    no-permission: "%overwatch_prefix% &cYou don't have permission to use this NPC!"

    # Hologram
    hologram:
      title: "&6&l⚖ OVERWATCH ⚖"
      weekly-reviewed: "&7Reviewed this week: &e%count%"
      total-punished: "&7Total punished: &c%count%"
      pending-queue: "&7Pending reports: &a%count%"
      click-prompt: "&a&lRight Click!"
      loading: "&7Loading..."

  # Review Messages
  review:
    loading: "%overwatch_prefix% &7Loading report... &e#%id%"
    replay-started: "%overwatch_prefix% &aReplay started! You can start reviewing."
    replay-failed: "%overwatch_prefix% &7Failed to start replay!"
    replay-completed: "%overwatch_prefix% &7Replay finished! Please submit your verdict."
    no-reports: "%overwatch_prefix% &7No reports available for review!"
    try-later: "&7Please try again later."
    completed: "%overwatch_prefix% &aReview completed! &e+%xp% XP &8| %rank% &7Level %level%"
    verdict-submitted: "%overwatch_prefix% &7Replay finished! Please submit your verdict."

  # Verdict Messages
  verdict:
    header: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    title: "&6&l⚖ OVERWATCH - VERDICT SUBMITTED ⚖"
    report-id: "&7Report: &e#%id%"
    your-verdict: "&7Your verdict: %verdict%"
    category: "&7Category: &e%category%"
    review-time: "&7Review Duration: &b%time% seconds"
    thank-you: "&a&lThank you! Review recorded."
    footer: "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    cancelled: "%overwatch_prefix% &eReview cancelled. Report returned to queue."

    # Verdict types (for display)
    types:
      guilty: "&c&lGUILTY"
      innocent: "&a&lINNOCENT"
      skip: "&e&lSKIPPED"

    # Category names (for display)
    categories:
      combat: "Combat Hacks"
      movement: "Movement Hacks"
      visual: "Visual Hacks"
      other: "Other"
      none: "None"

    # Voting stats format (used in /reports command)
    voting-stats:
      format: "%guilty% guilty, %innocent% innocent"
      format-with-skip: "%guilty% guilty, %innocent% innocent, %skip% skipped"
      guilty: "guilty"
      innocent: "innocent"
      skip: "skipped"

  # Command Messages
  commands:
    player-only: "%overwatch_prefix% &cOnly players can use this command!"
    unknown-command: "%overwatch_prefix% &cUnknown command! &7/overwatch help"
    usage: "%overwatch_prefix% &cUnknown command! &7/overwatch help"
    usage-npc: "%overwatch_prefix% &cUsage: /overwatch npc <create|delete|list>"
    usage-npc-delete: "%overwatch_prefix% &cUsage: /overwatch npc delete <npcId>"
    usage-npc-delete-tip: "&7To see available NPCs: &e/overwatch npc list"
    usage-addqueue: "%overwatch_prefix% &cUsage: /overwatch addqueue <reportId> [priority]"
    addqueue-usage: "%overwatch_prefix% &cUsage: /overwatch addqueue <reportId> [priority]"
    player-not-found: "%overwatch_prefix% &cPlayer not found: %player%"
    invalid-number: "%overwatch_prefix% &cInvalid number!"
    queue-added: "%overwatch_prefix% &7Report #%id% added to queue!"
    queue-priority: "&7Priority: &e%priority%"
    no-permission: "%overwatch_prefix% &cYou don't have permission to use this command!"
    no-permission-admin: "%overwatch_prefix% &cYou don't have permission to use this command!"

    npc:
      usage: "%overwatch_prefix% &cUsage: /overwatch npc <create|delete|list>"
      unknown: "%overwatch_prefix% &cUnknown NPC command! &7/overwatch npc help"
      created: "%overwatch_prefix% &7NPC created successfully!"
      created-id: "&7NPC ID: &e%id%"
      created-location: "&7Location: &e%world% %x%, %y%, %z%"
      create-failed: "%overwatch_prefix% &cFailed to create NPC!"
      deleted: "%overwatch_prefix% &7NPC deleted successfully! &8(ID: %id%)"
