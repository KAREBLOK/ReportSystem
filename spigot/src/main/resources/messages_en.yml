      back:
        name: "&c◀ Back"
        lore:
          - "&7Return to report list"

  # Replay Control GUI
  replay-control:
    title: "&8Replay Controls"
    play: "&aPlay"
    pause: "&ePause"
    stop: "&cStop"
    speed: "&bSpeed: &f%speed%x"
