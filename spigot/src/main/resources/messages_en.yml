# ReportSystem English Messages
# Color codes: & (example: &a for green)
# Placeholders are marked with %placeholder%

# ======================
# Prefixes
# ======================
prefix:
  general: "&8[&6Report&8]"
  success: "&8[&a✓&8]"
  error: "&8[&c✗&8]"
  info: "&8[&b!&8]"
  warning: "&8[&e⚠&8]"

# ======================
# General Messages
# ======================
general:
  no-permission: "%prefix_error% &cYou don't have permission to use this command!"
  player-not-found: "%prefix_error% &cPlayer '&e%player%&c' not found!"
  player-offline: "%prefix_error% &c%player% &7is offline!"
  invalid-syntax: "%prefix_error% &cUsage: &e%usage%"
  only-players: "%prefix_error% &cThis command can only be used by players!"
  cooldown: "%prefix_warning% &eYou must wait &6%time% &ebefore reporting again!"
  rate-limit: "%prefix_error% &cYou are creating too many reports! &ePlease wait 1 minute. &7(Limit: &f%limit% &7reports/minute)"
  teleported: "%prefix_success% &aTeleported to &e%player%&a!"

  # Error messages
  error:
    general: "%prefix_error% &cAn error occurred!"
    contact-staff: "&7Please contact a staff member."
    database: "%prefix_error% &cDatabase error occurred!"
    unknown: "%prefix_error% &cAn unknown error occurred!"
    details: "&7Error: %error%"

# ======================
# Report Messages
# ======================
reports:
  success: "%prefix_success% &aReport created successfully! &7(ID: #%id%)"
  cannot-report-self: "%prefix_error% &cYou cannot report yourself!"
  cannot-report-immune: "%prefix_error% &cThis player cannot be reported!"
  cannot-report-offline: "%prefix_error% &c%player% &7is offline! Only online players can be reported."
  already-recording: "%prefix_error% &c%player% &7is already being recorded! You cannot report them again until the recording ends."
  reason-too-short: "%prefix_error% &cReason must be at least &e%min% &ccharacters!"
  reason-too-long: "%prefix_error% &cReason cannot exceed &e%max% &ccharacters!"
  limit-reached: "%prefix_error% &cYou cannot report &e%player% &canymore! &7(Limit: &f%limit%&7)"

  # New limit messages (PENDING based)
  limit-pending: "%prefix_error% &cYou already have &e%count% &cpending reports for this player! &7(Maximum: &f%limit%&7)"
  create-failed: "%prefix_error% &cAn error occurred while creating the report!"
  contact-staff: "&7Please contact a staff member."
  unexpected-error: "%prefix_error% &cAn unexpected error occurred while creating the report!"
  limit-wait: "&7You can create new reports after the previous ones are reviewed and closed."

  # Report errors
  error:
    create-failed: "%prefix_error% &cFailed to create report!"
    update-failed: "%prefix_error% &cFailed to update report!"
    delete-failed: "%prefix_error% &cFailed to delete report!"
    not-found: "%prefix_error% &cReport not found!"
    load-failed: "%prefix_error% &cFailed to load reports!"

  # Report status messages
  status:
    accepted: "%prefix_success% &aReport #%id% has been accepted."
    rejected: "%prefix_info% &cReport #%id% has been rejected."
    closed: "%prefix_info% &7Report #%id% has been closed."
    updated: "%prefix_success% &aReport status updated."

    # Status names (for GUI)
    name:
      pending: "Pending"
      accepted: "Accepted"
      rejected: "Rejected"
      closed: "Closed"

  # Notifications
  notify:
    staff: |
      &8&m
      %prefix_general% &eNew Report!
      &7Player: &c%reported%
      &7Reporter: &e%reporter%
      &7Reason: &f%reason%
      &7Server: &b%server%
      &7ID: &f#%id%
      &8&m

    title: "&6New Report"
    subtitle: "&e%reporter% &7➜ &c%reported%"
    actionbar: "&e⚠ New report: &c%reported% &7(#%id%)"

  # List messages
  list:
    header: "&8&m          &r &6Report List &7(Page %page%/%max%) &8&m          "
    format: "&7#%id% &8| &e%reporter% &7➜ &c%reported% &8| &f%reason%"
    footer: "&8&m                                                  "
    empty: "%prefix_info% &7No reports found."
    no-permission-view: "%prefix_error% &cYou don't have permission to view this report!"

# ======================
# Replay Messages
# ======================
replay:
  starting: "%prefix_info% &eStarting replay..."
  started: "%prefix_success% &aReplay started! Teleported to main character."
  stopped: "%prefix_info% &cReplay stopped."
  not-found: "%prefix_error% &cNo replay recording found for this report!"
  data-empty: "%prefix_error% &cReplay data is empty! Recording may be corrupted."
  already-watching: "%prefix_error% &cYou are already watching a replay! Stop the current replay first."
  completed: "%prefix_success% &a✓ Replay completed!"

  # Title messages
  title-started: "&6✦ REPLAY STARTED ✦"
  subtitle-started: "&7%player% &8- &7Report #%report_id%"
  title-completed: "&6Replay Ended"
  subtitle-completed: "&7%player%'s recording has ended"

  # Error messages
  error-database: "%prefix_error% &cDatabase error while loading replay!"
  error-read: "%prefix_error% &cError reading replay data!"
  error-corrupt: "&7Replay data may be corrupted. Error: %error%"
  error-class: "%prefix_error% &cReplay class not found!"
  error-version: "&7Plugin version may be incompatible. Error: %error%"
  error-unexpected: "%prefix_error% &cUnexpected error while starting replay!"

  # Nametag prefixes
  nametag-recorded-player: "&c&l[WATCHED] "

  recording:
    started: "%prefix_info% &eRecording player movements..."
    stopped: "%prefix_info% &7Recording stopped."
    failed: "%prefix_error% &cFailed to start recording!"
    no-report-id: "%prefix_error% &cCouldn't get report ID, recording cancelled!"

  # Replay errors
  error:
    data-empty: "%prefix_error% &cReplay data is empty! Recording may be corrupted."
    data-corrupt: "%prefix_error% &cError reading replay data!"
    data-corrupt-detail: "&7Replay data may be corrupted. Error: %error%"
    class-not-found: "%prefix_error% &cReplay class not found!"
    class-not-found-detail: "&7Plugin version may be incompatible. Error: %error%"
    unexpected: "%prefix_error% &cUnexpected error while starting replay!"
    unexpected-detail: "&7Error: %error%"
    database: "%prefix_error% &cDatabase error while loading replay!"
    database-detail: "&7Error: %error%"
    load-failed: "%prefix_error% &cFailed to load replay!"

  controls:
    paused: "&ePaused"
    resumed: "&aResumed"
    speed-changed: "&7Speed: &e%speed%x"
    forward: "&7Fast forward &e%seconds%s"
    rewind: "&7Rewind &e%seconds%s"
    jump-disabled: "%prefix_error% &c✗ Time jump feature is not active yet!"

# ======================
# Punishment Messages
# ======================
punishments:
  ban:
    success: "%prefix_success% &aPlayer &e%player% &ahas been banned!"
    already-banned: "%prefix_error% &cPlayer is already banned!"
    not-banned: "%prefix_error% &cPlayer is not banned!"
    unbanned: "%prefix_success% &aPlayer &e%player% &ahas been unbanned!"
    offline: "%prefix_error% &c%player% &7is offline! Player must be online for animated ban."
    enter-reason: "&6Enter ban reason (default: %default%)"
    animated-started: "&a⚡ &lANIMATED BAN STARTED!"
    animated-target: "&7Target: &c%player%"
    animated-duration: "&7Duration: &e%duration%"
    animated-reason: "&7Reason: &f%reason%"
    animated-message: "&4The wrath of the gods begins..."

  mute:
    success: "%prefix_success% &aPlayer &e%player% &ahas been muted!"
    already-muted: "%prefix_error% &cPlayer is already muted!"
    not-muted: "%prefix_error% &cPlayer is not muted!"
    unmuted: "%prefix_success% &aPlayer &e%player% &ahas been unmuted!"
    enter-reason: "&6Enter mute reason (default: %default%)"

  kick:
    success: "%prefix_success% &e%player% &7has been kicked!"
    offline: "%prefix_error% &c%player% &7is offline!"
    enter-reason: "&6Enter kick reason (default: %default%)"
    player-message: |
      &c&lKICKED FROM SERVER!

      &7Reason: &f%reason%
      &7Staff: &f%staff%

  warn:
    success: "%prefix_success% &e%player% &7has been warned!"
    offline: "%prefix_error% &c%player% &7is offline!"
    enter-reason: "&6Enter warning message (default: %default%)"
    player-message: |

      &6&l⚠ WARNING ⚠
      &eYou have been warned by staff!

      &7Reason: &f%reason%
      &7Staff: &f%staff%
      &eContinuing to break rules may result in punishment!


  # General punishment messages
  applied: "%prefix_success% &aPunishment applied successfully."
  failed: "%prefix_error% &cFailed to apply punishment."
  removed: "%prefix_success% &aPunishment removed."
  history-empty: "%prefix_info% &7This player has a clean punishment history."
  duration-invalid: "%prefix_error% &cInvalid duration format!"

# ======================
# GUI Messages
# ======================
gui:
  # Common
  common:
    close: "&cClose"
    back: "&aBack"
    next-page: "&aNext Page"
    previous-page: "&ePrevious Page"
    confirm: "&aConfirm"
    cancel: "&cCancel"
    loading: "&7Loading..."
    refresh: "&bRefresh"

  # Report GUI
  report:
    title: "&8Report > %player%"
    select-reason: "&eSelect a reason:"
    custom-reason: "&bCustom Reason"
    quick-reasons: "&6Quick Reasons"
    online: "&aOnline"
    offline: "&cOffline"
    enter-reason: "&6Enter report reason:"
    cancel-instruction: "&7Type or write &e'cancel' &7to exit."
    creating: "&7Creating report..."
    create-error: "&cAn error occurred while creating report!"

  # Report Create GUI
  report-create:
    reasons:
      cheating: "Cheating"
      chat-abuse: "Chat Abuse"
      griefing: "Griefing"
      bug-abuse: "Bug Abuse"
      teaming: "Teaming"

  # Report List GUI
  report-list:
    title: "&8Reports &7(%page%/%max_page%)"
    loading-error: "&cAn error occurred while loading reports!"

    # Report item
    report-item:
      name: "&e#%id% &8- &f%reported%"
      labels:
        reporter: "Reporter:"
        reason: "Reason:"
        server: "Server:"
        date: "Date:"
        status: "Status:"
        total-reports: "Total Reports:"
        overwatch: "Overwatch:"
        click: "▸ Click to view details"

    # Empty list
    empty-list:
      name: "&cNo Reports Found"
      lore:
        - ""
        - "&7No reports match"
        - "&7your current filter."
        - ""
        - "&eTry changing the filter"
        - "&7or check back later."

    # Navigation
    navigation:
      previous:
        name: "&e« Previous Page"
        lore: "&7Go to page %prev_page%"
      page-info:
        name: "&fPage &e%page%&f/&e%max_page%"
        lore:
          - ""
          - "&7Total reports: &f%total%"
          - "&7Showing: &f%showing%"
          - ""
          - "&eClick to jump to page"
      next:
        name: "&aNext Page »"
        lore: "&7Go to page %next_page%"

    # Filters
    filter:
      all:
        name: "&fAll Reports"
        lore:
          - "&7Show all reports"
          - ""
          - "Status: %selected%"
      pending:
        name: "&ePending Reports"
        lore:
          - "&7Show unresolved reports"
          - ""
          - "&7Count: &f%count%"
          - "Status: %selected%"
      accepted:
        name: "&aAccepted Reports"
        lore:
          - "&7Show accepted reports"
          - ""
          - "&7Count: &f%count%"
          - "Status: %selected%"
      rejected:
        name: "&cRejected Reports"
        lore:
          - "&7Show rejected reports"
          - ""
          - "&7Count: &f%count%"
          - "Status: %selected%"
      mine:
        name: "&bMy Reports"
        lore:
          - "&7Show reports you created"
          - ""
          - "&7Count: &f%count%"
          - "Status: %selected%"
      assigned:
        name: "&dAssigned to Me"
        lore:
          - "&7Show reports assigned to you"
          - ""
          - "&7Count: &f%count%"
          - "Status: %selected%"
      selected: "&a✔ Selected"
      not-selected: "&7✖ Not Selected"

    # Sort
    sort:
      name: "&6Sort Options"
      lore:
        - ""
        - "&7Current: &e%sort_method%"
        - ""
        - "&8▪ &fNewest First"
        - "&8▪ &fOldest First"
        - "&8▪ &fPriority"
        - "&8▪ &fPlayer Name"
        - ""
        - "&eClick to change"
      newest: "&bNewest First"
      oldest: "&7Oldest First"
      priority: "&cPriority"
      player-name: "&aPlayer Name"

    # Actions
    actions:
      refresh:
        name: "&a↻ Refresh"
        lore:
          - "&7Refresh the report list"
          - ""
          - "&8Last refresh: %last_refresh%"
      search:
        name: "&b🔍 Search"
        lore:
          - "&7Search for specific"
          - "&7players or keywords"
          - ""
          - "&eCurrent: &f%search_query%"
          - ""
          - "&eClick to search"
      stats:
        name: "&a📊 Statistics"
        lore:
          - ""
          - "&8▪ &7Total: &f%total%"
          - "&8▪ &7Pending: &e%pending%"
          - "&8▪ &7Accepted: &a%accepted%"
          - "&8▪ &7Rejected: &c%rejected%"
          - ""
          - "&8▪ &7This week: &f%weekly%"
          - "&8▪ &7Today: &f%daily%"
      settings:
        name: "&c⚙ Settings"
        lore:
          - "&7Configure report"
          - "&7list settings"
          - ""
          - "&eClick to open"

  # Report Detail GUI
  report-detail:
    title: "&8Report #%id%"
    player-head-name: "&c⚡ %reported%"

    # Info labels
    labels:
      report-id: "Report ID:"
      reporter: "Reporter:"
      reason: "Reason:"
      date: "Date:"
      server: "Server:"
      total-reports: "Total Reports:"
      status: "Status:"
