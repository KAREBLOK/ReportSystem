# ReportSystem English Messages
# Color codes: & (example: &a for green)
# Placeholders are marked with %placeholder%

# ======================
# Prefixes
# ======================
prefix:
  general: "&8[&6Report&8]"
  success: "&8[&a✓&8]"
  error: "&8[&c✗&8]"
  info: "&8[&b!&8]"
  warning: "&8[&e⚠&8]"

# ======================
# General Messages
# ======================
general:
  no-permission: "%prefix_error% &cYou don't have permission to use this command!"
  player-not-found: "%prefix_error% &cPlayer '&e%player%&c' not found!"
  player-offline: "%prefix_error% &c%player% &7is offline!"
  invalid-syntax: "%prefix_error% &cUsage: &e%usage%"
  only-players: "%prefix_error% &cThis command can only be used by players!"
  cooldown: "%prefix_warning% &eYou must wait &6%time% &ebefore reporting again!"
  rate-limit: "%prefix_error% &cYou are creating too many reports! &ePlease wait 1 minute. &7(Limit: &f%limit% &7reports/minute)"
  teleported: "%prefix_success% &aTeleported to &e%player%&a!"

  # Error messages
  error:
    general: "%prefix_error% &cAn error occurred!"
    contact-staff: "&7Please contact a staff member."
    database: "%prefix_error% &cDatabase error occurred!"
    unknown: "%prefix_error% &cAn unknown error occurred!"
    details: "&7Error: %error%"

# ======================
# Report Messages
# ======================
reports:
  success: "%prefix_success% &aReport created successfully! &7(ID: #%id%)"
  cannot-report-self: "%prefix_error% &cYou cannot report yourself!"
  cannot-report-immune: "%prefix_error% &cThis player cannot be reported!"
  cannot-report-offline: "%prefix_error% &c%player% &7is offline! Only online players can be reported."
  already-recording: "%prefix_error% &c%player% &7is already being recorded! You cannot report them again until the recording ends."
  reason-too-short: "%prefix_error% &cReason must be at least &e%min% &ccharacters!"
  reason-too-long: "%prefix_error% &cReason cannot exceed &e%max% &ccharacters!"
  limit-reached: "%prefix_error% &cYou cannot report &e%player% &canymore! &7(Limit: &f%limit%&7)"

  # New limit messages (PENDING based)
  limit-pending: "%prefix_error% &cYou already have &e%count% &cpending reports for this player! &7(Maximum: &f%limit%&7)"
  create-failed: "%prefix_error% &cAn error occurred while creating the report!"
  contact-staff: "&7Please contact a staff member."
  unexpected-error: "%prefix_error% &cAn unexpected error occurred while creating the report!"
  limit-wait: "&7You can create new reports after the previous ones are reviewed and closed."

  # Report errors
  error:
    create-failed: "%prefix_error% &cFailed to create report!"
    update-failed: "%prefix_error% &cFailed to update report!"
    delete-failed: "%prefix_error% &cFailed to delete report!"
    not-found: "%prefix_error% &cReport not found!"
    load-failed: "%prefix_error% &cFailed to load reports!"

  # Report status messages
  status:
    accepted: "%prefix_success% &aReport #%id% has been accepted."
    rejected: "%prefix_info% &cReport #%id% has been rejected."
    closed: "%prefix_info% &7Report #%id% has been closed."
    updated: "%prefix_success% &aReport status updated."

    # Status names (for GUI)
    name:
      pending: "Pending"
      accepted: "Accepted"
      rejected: "Rejected"
      closed: "Closed"

  # Notifications
  notify:
    staff: |
      &8&m
      %prefix_general% &eNew Report!
      &7Player: &c%reported%
      &7Reporter: &e%reporter%
      &7Reason: &f%reason%
      &7Server: &b%server%
      &7ID: &f#%id%
      &8&m

    title: "&6New Report"
    subtitle: "&e%reporter% &7➜ &c%reported%"
    actionbar: "&e⚠ New report: &c%reported% &7(#%id%)"

    # Toast notification settings (advancement-style popup in top right corner)
    # Frame types: TASK (Advancement Made), GOAL (Goal Reached), CHALLENGE (Challenge Complete)
    # Icon: Any Minecraft material name (PAPER, MAP, BELL, BOOK, DIAMOND, etc.)
    # Placeholders: %reporter%, %reported%, %reason%, %id%, %server%
    toast:
      new-report:
        title: "&c⚠ New report notification! &8(#%id%)"
        icon: "BELL"
        frame: "GOAL"
      status-update:
        title: "&6Report #%id% &7status: &e%status%"
        icon: "MAP"
        frame: "TASK"

  # Reporter feedback (Hypixel style - only for accepted reports)
  reporter-feedback:
    accepted: "%prefix_success% &aYour report has been reviewed and action was taken! &7(Report #%id% - %player%)"

    # Staff join notification (pending reports)
    staff-join-title: "&6&l⚠ PENDING REPORTS"
    staff-join-message: "&eThere are &c%count% &epending reports on the server!"
    staff-join-action: "&eCheck them: &b/reports"

  # List messages
  list:
    header: "&8&m          &r &6Report List &7(Page %page%/%max%) &8&m          "
    format: "&7#%id% &8| &e%reporter% &7➜ &c%reported% &8| &f%reason%"
    footer: "&8&m                                                  "
    empty: "%prefix_info% &7No reports found."
    no-permission-view: "%prefix_error% &cYou don't have permission to view this report!"

  # Report action messages (staff actions)
  actions:
    select-punishment: "%prefix_warning% &ePlease select a punishment or close the GUI."
    accept-cancelled: "%prefix_error% &cReport acceptance cancelled."
    already-handled: "%prefix_error% &cThis report has already been handled by another staff member."
    accepted-no-punishment: "%prefix_success% &aReport #%id% accepted without punishment."
    rejected: "%prefix_error% &cReport #%id% rejected."
    deleted: "%prefix_success% &aReport #%id% and related replay deleted."
    update-failed: "%prefix_error% &cFailed to update report!"
    database-error: "%prefix_error% &cDatabase error while updating report."

  # Chat messages (used during report creation)
  chat:
    enter-reason: "&6Enter report reason:"
    cancel-instruction: "&7Type or write &e'cancel' &7to exit."
    creating: "&7Creating report..."
    create-error: "&cAn error occurred while creating report!"
    cancelled: "%prefix_error% &cReport cancelled."
    enter-search: "&6Enter the player name to search:"
    enter-punishment-reason: "&6Enter %type% reason:"
    enter-assignment: "&6Enter staff name to assign the report to:"
    enter-note: "&6Enter the note you want to add:"
    enter-duration: "&6Enter ban duration (e.g. 2h, 15d, 1w):"
    input-cancelled: "%prefix_error% &cInput cancelled."
    invalid-duration: "%prefix_error% &cInvalid duration! Operation cancelled."

# ======================
# Replay Messages
# ======================
replay:
  starting: "%prefix_info% &eStarting replay..."
  started: "%prefix_success% &aReplay started! Teleported to main character."
  stopped: "%prefix_info% &cReplay stopped."
  not-found: "%prefix_error% &cNo replay recording found for this report!"
  data-empty: "%prefix_error% &cReplay data is empty! Recording may be corrupted."
  already-watching: "%prefix_error% &cYou are already watching a replay! Stop the current replay first."
  completed: "%prefix_success% &a✓ Replay completed!"

  # Title messages
  title-started: "&6✦ REPLAY STARTED ✦"
  subtitle-started: "&7%player% &8- &7Report #%report_id%"
  title-completed: "&6Replay Ended"
  subtitle-completed: "&7%player%'s recording has ended"

  # Error messages
  error-database: "%prefix_error% &cDatabase error while loading replay!"
  error-read: "%prefix_error% &cError reading replay data!"
  error-corrupt: "&7Replay data may be corrupted. Error: %error%"
  error-class: "%prefix_error% &cReplay class not found!"
  error-version: "&7Plugin version may be incompatible. Error: %error%"
  error-unexpected: "%prefix_error% &cUnexpected error while starting replay!"
  teleported: "%prefix_success% &aReplay started! Teleported to main character."

  # Replay cross-server messages
  cross-server: "%prefix_info% &eReplay is on &b%server%&e. Transferring you there..."
  return-server: "%prefix_success% &a✦ Replay finished! Returning to &b%server%&a..."
  return-location: "%prefix_success% &a✦ Replay finished! Returned to your starting location."
  not-watching: "%prefix_error% &cYou are not watching a replay!"
  stopped-error: "%prefix_error% &cReplay stopped (with error)!"
  stopped-shutdown: "%prefix_info% &cReplay stopped (server shutting down)!"
  world-missing: "%prefix_error% &cReplay world not found! The world may have been deleted or unloaded."
  server-connect-error: "%prefix_error% &cError connecting to server!"
  world-change: "%prefix_info% &e✦ Replay: Changing to &b%world% &eworld..."
  command-blocked: "%prefix_error% &cYou cannot use this command while watching a replay!"
  command-blocked-tip: "&eStop the replay first: &f/replay stop"

  # Nametag prefixes
  nametag-recorded-player: "&c&l[WATCHED] "

  recording:
    started: "%prefix_info% &eRecording player movements..."
    stopped: "%prefix_info% &7Recording stopped."
    failed: "%prefix_error% &cFailed to start recording!"
    no-report-id: "%prefix_error% &cCouldn't get report ID, recording cancelled!"
    continue-warning: "%prefix_warning% &eYour movements are still being recorded!"
    auto-start: "%prefix_info% &a✦ Replay starting automatically..."

  # Replay errors
  error:
    data-empty: "%prefix_error% &cReplay data is empty! Recording may be corrupted."
    data-corrupt: "%prefix_error% &cError reading replay data!"
    data-corrupt-detail: "&7Replay data may be corrupted. Error: %error%"
    class-not-found: "%prefix_error% &cReplay class not found!"
    class-not-found-detail: "&7Plugin version may be incompatible. Error: %error%"
    unexpected: "%prefix_error% &cUnexpected error while starting replay!"
    unexpected-detail: "&7Error: %error%"
    database: "%prefix_error% &cDatabase error while loading replay!"
    database-detail: "&7Error: %error%"
    load-failed: "%prefix_error% &cFailed to load replay!"

  controls:
    paused: "&ePaused"
    resumed: "&aResumed"
    speed-changed: "&7Speed: &e%speed%x"
    forward: "&7Fast forward &e%seconds%s"
    rewind: "&7Rewind &e%seconds%s"
    jump-disabled: "%prefix_error% &c✗ Time jump feature is not active yet!"

  # Web Replay messages
  web-replay:
    disabled: "%prefix_error% &cWeb replay system is disabled! &7Enable it in config."
    generating: "%prefix_info% &eGenerating web replay... &7(Report #%report_id%)"
    ready: "%prefix_success% &aWeb replay is ready!"
    url: "&b%url%"
    failed: "%prefix_error% &cFailed to generate web replay. Check console."
    usage: "%prefix_error% &cUsage: &e/reportsystem webreplay <reportId>"
    invalid-id: "%prefix_error% &cInvalid report ID!"
    uploading: "%prefix_info% &eUploading replay to website..."
    upload-success: "%prefix_success% &aReplay uploaded to website!"
    upload-failed: "%prefix_warning% &eFailed to upload replay to website, using local URL."

# ======================
# Punishment Messages
# ======================
punishments:
  ban:
    success: "%prefix_success% &aPlayer &e%player% &ahas been banned!"
    already-banned: "%prefix_error% &cPlayer is already banned!"
    not-banned: "%prefix_error% &cPlayer is not banned!"
    unbanned: "%prefix_success% &aPlayer &e%player% &ahas been unbanned!"
    offline: "%prefix_error% &c%player% &7is offline! Player must be online for animated ban."
    enter-reason: "&6Enter ban reason (default: %default%)"
    animated-started: "&a⚡ &lANIMATED BAN STARTED!"
    animated-target: "&7Target: &c%player%"
    animated-duration: "&7Duration: &e%duration%"
    animated-reason: "&7Reason: &f%reason%"
    animated-message: "&4The wrath of the gods begins..."
    # Ban screen messages shown to the player
    screen-temp: |
      &cYou have been banned from the server!

      &7Reason: &f%reason%
      &7Duration: &f%duration%
      &7Expires: &f%expires%
      &7Banned by: &f%staff%
    screen-perm: |
      &cYou have been permanently banned!

      &7Reason: &f%reason%
      &7Banned by: &f%staff%

      &8Appeal at: %discord_url%
    # Animated ban special messages
    death-message: "&4&l☠ &c%player% &7suffered the wrath of the gods!"
    animated-screen: "&4&l⚡ BAN ⚡\n&cReason: &f%reason%\n&7Staff: &f%staff%"

  mute:
    success: "%prefix_success% &aPlayer &e%player% &ahas been muted!"
    already-muted: "%prefix_error% &cPlayer is already muted!"
    not-muted: "%prefix_error% &cPlayer is not muted!"
    unmuted: "%prefix_success% &aPlayer &e%player% &ahas been unmuted!"
    enter-reason: "&6Enter mute reason (default: %default%)"
    # Mute notification shown to the player
    player-message: |
      &c▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
      &c          YOU HAVE BEEN MUTED!

      &7  Reason: &f%reason%
      &7  Duration: &f%duration%
      &7  Staff: &f%staff%
      &c▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
    # When muted player tries to chat
    chat-blocked: "&c✗ You are muted!%time_left%"
    chat-blocked-detail: "&7You cannot type in chat."
    time-remaining: " (%time% remaining)"
    time-permanent: " (Permanent)"
    # When unmuted
    unmuted-player: "&a✓ You can now speak again!"

  kick:
    success: "%prefix_success% &e%player% &7has been kicked!"
    offline: "%prefix_error% &c%player% &7is offline!"
    enter-reason: "&6Enter kick reason (default: %default%)"
    player-message: |
      &c&lKICKED FROM SERVER!

      &7Reason: &f%reason%
      &7Staff: &f%staff%
    # Internal kick screen (with re-entry note)
    screen: |
      &cYou have been kicked from the server!

      &7Reason: &f%reason%
      &7Kicked by: &f%staff%

      &aYou may rejoin.

  warn:
    success: "%prefix_success% &e%player% &7has been warned!"
    success-detail: "&7Message: &f%reason%"
    offline: "%prefix_error% &c%player% &7is offline!"
    enter-reason: "&6Enter warning message (default: %default%)"
    player-message: |
      &6▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
      &6          ⚠ WARNING ⚠

      &c  You have been warned by staff!

      &7  Reason: &f%reason%
      &7  Staff: &f%staff%
      &7  Warning count: &e%count%

      &c  Continuing to break rules may result
      &c  in more severe punishment!
      &6▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
    title: "&6⚠ WARNING ⚠"
    subtitle: "&cYou violated the rules!"
    # Login warning reminder
    login-warning: "&e⚠ &cWarning! You have &f%count% &cwarning(s)!"
    login-warning-detail: "&7Continuing to break rules may result in punishment."

  # General punishment messages
  applied: "%prefix_success% &aPunishment applied successfully."
  applied-with-report: "%prefix_success% &a✓ Punishment applied and report accepted!"
  applied-report-failed: "%prefix_error% &cPunishment applied but failed to update report!"
  failed: "%prefix_error% &cFailed to apply punishment."
  removed: "%prefix_success% &aPunishment removed."
  history-empty: "%prefix_info% &7This player has a clean punishment history."
  duration-invalid: "%prefix_error% &cInvalid duration format!"
  default-reason: "Rule violation"
  # Punishment success with player name
  success-target: "%prefix_success% &a✓ Punishment applied successfully for &e%player%&a."
  # Punishment removal messages
  unban-success: "%prefix_success% &a✓ &e%player% &ahas been unbanned!"
  unban-failed: "%prefix_error% &c✗ Error unbanning &e%player%&c!"
  unmute-success: "%prefix_success% &a✓ &e%player% &ahas been unmuted!"
  unmute-failed: "%prefix_error% &c✗ Error unmuting &e%player%&c!"
  no-active-punishment: "%prefix_error% &cNo active punishment found for %player%!"
  no-active-detail: "&7No ban or mute punishment."
  operation-complete: "&7Operation complete!"
  # Discord URL (shown on ban screen)
  discord-url: "discord.gg/server"

# ======================
# Command Messages
# ======================
commands:
  report:
    usage: "/report <player> [reason]"
    description: "Report a player"

  reports:
    usage: "/reports [page]"
    description: "View reports"

  reportsystem:
    usage: "/reportsystem <reload|info|stats>"
    description: "Plugin management"
    reloaded: "%prefix_success% &aConfiguration reloaded!"

    help:
      header: "&6=== ReportSystem Commands ==="
      reload: "&e/reportsystem reload &7- Reload configuration"
      stats: "&e/reportsystem stats &7- Show statistics"
      info: "&e/reportsystem info &7- Show plugin info"
      debug: "&e/reportsystem debug <true/false> &7- Toggle debug mode"
      testnotif: "&e/reportsystem testnotif &7- Test toast notification"
      checkadv: "&e/reportsystem checkadv &7- Check advancement status"

    info:
      header: "&6=== ReportSystem Information ==="
      version: "&eVersion: &f%version%"
      developer: "&eDeveloper: &f%developer%"
      mode: "&eMode: &f%mode%"
      database: "&eDatabase: &f%database%"
      replay: "&eReplay System: &f%replay%"
      active: "Active"
      inactive: "Inactive"
      bungeecord: "BungeeCord"
      standalone: "Standalone"

    stats:
      header: "&6=== ReportSystem Statistics ==="
      active-recordings: "&eActive Recordings: &f%count%"
      active-replays: "&eActive Replay Viewers: &f%count%"
      total-reports: "&eTotal Reports: &f%count%"
      pending-reports: "&ePending Reports: &f%count%"
      database-error: "&cFailed to fetch database statistics!"

    debug:
      usage: "&cUsage: /reportsystem debug <true/false>"
      enabled: "&aDebug mode: &aEnabled"
      disabled: "&aDebug mode: &cDisabled"

    testnotif:
      sending: "&aTesting toast notification..."
      sent: "&aToast sent! Check the top right corner."
      failed: "&cAdvancementNotification system could not be initialized!"
      title: "Test Notification"
      message: "This is a test toast notification"

    checkadv:
      header: "&6=== Advancement Status ==="
      loaded: "&a✓ Advancement loaded: &freportsystem:notification"
      working: "&aToast notifications will work!"
      not-found: "&c✗ Advancement not found!"
      datapack-loaded: "&eDatapack is loaded but advancement is not recognized."
      need-restart: "&eYou need to restart the server!"
      fallback: "&7Title will be used as fallback."
      datapack-exists: "&a✓ Datapack folder exists"
      json-exists: "&a✓ notification.json file exists"
      json-missing: "&c✗ notification.json file not found!"
      datapack-missing: "&c✗ Datapack folder not found!"

